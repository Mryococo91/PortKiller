name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PortKiller.sln

      - name: Build
        run: dotnet build PortKiller.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/PortKiller.Tests/PortKiller.Tests.csproj -c Release --verbosity normal
