name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # PortKiller.csproj defaults RuntimeIdentifier to win-<arch>; restore that RID
      # explicitly so the win-x64 runtime pack is available before --no-restore build.
      - name: Restore
        run: |
          dotnet restore PortKiller.sln -p:Platform=x64
          dotnet restore PortKiller.csproj -p:Platform=x64 -r win-x64

      - name: Build
        run: dotnet build PortKiller.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/PortKiller.Tests/PortKiller.Tests.csproj -c Release --verbosity normal
