name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # PortKiller.csproj defaults RuntimeIdentifier to win-<arch>. Restore that RID
      # so the win-x64 runtime pack exists before --no-restore build.
      - name: Restore
        run: |
          dotnet restore PortKiller.sln -p:Platform=x64
          dotnet restore PortKiller.csproj -p:Platform=x64 -r win-x64

      # Disable ReadyToRun here: CI validates compile/tests, not publish optimization.
      # Publish scripts keep PublishReadyToRun for distribution builds.
      - name: Build
        run: >
          dotnet build PortKiller.sln
          -c Release
          -p:Platform=x64
          -p:PublishReadyToRun=false
          --no-restore

      - name: Test
        run: dotnet test tests/PortKiller.Tests/PortKiller.Tests.csproj -c Release --verbosity normal

  smoke-publish-x64:
    runs-on: windows-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Smoke publish (portable + MSI)
        shell: pwsh
        run: .\scripts\run-smoke-checks.ps1 -Runtime win-x64 -Publish
