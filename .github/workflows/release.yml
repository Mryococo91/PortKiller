name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            platform: x64
            build_msi: true
          - runtime: win-x86
            platform: x86
            build_msi: true
          - runtime: win-arm64
            platform: ARM64
            build_msi: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = & .\scripts\Get-PortKillerVersion.ps1
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version") {
            throw "Git tag '$tag' must match Directory.Build.props Version 'v$version'."
          }

          $manifest = Get-Content -LiteralPath "Package.appxmanifest" -Raw
          if ($manifest -notmatch [regex]::Escape("Version=`"$version.0`"")) {
            throw "Package.appxmanifest Identity Version must be '$version.0' to match Directory.Build.props."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version $version (tag $tag OK)"

      - name: Publish portable layout
        shell: pwsh
        run: |
          .\scripts\publish-portable.ps1 `
            -Runtime ${{ matrix.runtime }} `
            -Version ${{ steps.version.outputs.version }} `
            -SkipZip

      - name: Optional Authenticode sign (portable binaries)
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host "Signing secrets not configured; skipping binary signing."
            exit 0
          }
          $portable = "artifacts\portable\${{ matrix.runtime }}"
          $paths = @(
            "$portable\PortKiller.exe",
            "$portable\runtime\PortKiller.exe"
          )
          .\scripts\sign-artifacts.ps1 -Paths $paths

      - name: Zip portable package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $runtime = "${{ matrix.runtime }}"
          $outDir = "artifacts\portable\$runtime"
          $zipPath = "artifacts\portable\PortKiller-$version-$runtime.zip"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          Compress-Archive -Path (Join-Path $outDir "*") -DestinationPath $zipPath -Force
          Write-Host "Created $zipPath"

      - name: Build Uninstaller.exe
        if: matrix.build_msi
        shell: pwsh
        run: |
          .\scripts\publish-msi.ps1 `
            -Runtime ${{ matrix.runtime }} `
            -Version ${{ steps.version.outputs.version }} `
            -UninstallerOnly

      - name: Optional Authenticode sign (Uninstaller)
        if: matrix.build_msi
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host "Signing secrets not configured; skipping Uninstaller signing."
            exit 0
          }
          .\scripts\sign-artifacts.ps1 -Paths @(
            "artifacts\portable\${{ matrix.runtime }}\Uninstaller.exe"
          )

      - name: Build MSI
        if: matrix.build_msi
        shell: pwsh
        run: |
          .\scripts\publish-msi.ps1 `
            -Runtime ${{ matrix.runtime }} `
            -Version ${{ steps.version.outputs.version }} `
            -MsiOnly

      - name: Optional Authenticode sign (MSI)
        if: matrix.build_msi
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            Write-Host "Signing secrets not configured; skipping MSI signing."
            exit 0
          }
          $msi = "artifacts\msi\PortKiller-${{ steps.version.outputs.version }}-${{ matrix.runtime }}.msi"
          .\scripts\sign-artifacts.ps1 -Paths @($msi)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PortKiller-${{ matrix.runtime }}
          path: |
            artifacts/portable/PortKiller-${{ steps.version.outputs.version }}-${{ matrix.runtime }}.zip
            artifacts/msi/PortKiller-${{ steps.version.outputs.version }}-${{ matrix.runtime }}.msi
          if-no-files-found: error

  publish-github-release:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
